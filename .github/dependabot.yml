version: 2

updates:
  # Bot dependencies (Yarn). Dependabot keys the "npm" ecosystem off
  # yarn.lock, so updates are resolved and committed with Yarn.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Wait 5 days after a release before proposing it, so broken or
    # compromised versions have time to be caught and yanked upstream.
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    versioning-strategy: increase
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      sapphire:
        patterns:
          - '@sapphire/*'
      discordjs:
        patterns:
          - 'discord.js'
          - '@discordjs/*'
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
