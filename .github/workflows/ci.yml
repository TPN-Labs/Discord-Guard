name: "CI"

# Pipeline logic lives in TPN-Labs/GitHub-Actions; this file only declares triggers and inputs.
# Checks it produces: "ci / Quality: ESLint", "ci / Quality: TypeScript", "ci / Build & Verify".
# Every job runs on the Hetzner self-hosted runner inside node:22 (the reusable workflow's defaults).

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    uses: TPN-Labs/GitHub-Actions/.github/workflows/reusable-node-ci.yml@main
    with:
      working-directory: "."
      app-label: "Discord Guard"
      artifact-prefix: discord-guard
      quality-checks: >-
        [{"name":"ESLint","command":"yarn lint"},
         {"name":"TypeScript","command":"yarn check-types"}]
      build-command: "yarn build"
      verify-dist: dist
