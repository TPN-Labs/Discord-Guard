name: 'CI'

# Self-contained Node CI for this public repository.
#
# This repo used to call the reusable workflow in TPN-Labs/GitHub-Actions, but that
# repo is private and GitHub does not let a public repository call reusable workflows
# from a private one: every run failed at startup with zero jobs, so the required
# checks never reported. The jobs below are a port of reusable-node-ci.yml with the
# inputs this repo used baked in.
#
# Jobs run on GitHub-hosted runners, not the self-hosted Hetzner runner: anyone can
# open a pull request against a public repository, and fork PRs must not execute on
# our own machines.
#
# The ruleset requires one CI check, "CI Gate / Result" (the `gate` job below),
# the same check every TPN Labs repository reports. It fails if any other job
# here failed or was cancelled. The other jobs keep the "ci / ..." names the
# reusable workflow produced.

# Pull requests only: CI gates changes before they merge, so it does not re-run on
# pushes to main.
on:
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  DIST_DIR: dist

jobs:
  quality:
    name: 'ci / Quality: ${{ matrix.name }}'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESLint
            command: yarn lint
          - name: TypeScript
            command: yarn check-types
          - name: Prettier
            command: yarn format:check
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      # package.json pins Yarn 4 via `packageManager`; Corepack provides that version.
      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  build-and-verify:
    name: 'ci / Build & Verify'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write # build summary comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Locate Yarn cache
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      # Unit tests (Vitest) run as a step here rather than as their own job or matrix leg:
      # Constitution §4.VII prefers a step in an existing job, which reuses this checkout
      # and install. A red test fails the required "ci / Build & Verify" check.
      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

      - name: Verify build output
        run: |
          if [ ! -d "$DIST_DIR" ]; then
            echo "::error::Build output directory '$DIST_DIR' not found"
            exit 1
          fi
          FILE_COUNT=$(find "$DIST_DIR" -type f | wc -l)
          TOTAL_SIZE=$(du -sh "$DIST_DIR" | cut -f1)
          echo "Build output: ${FILE_COUNT} files, ${TOTAL_SIZE}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: discord-guard-build-${{ github.run_number }}
          path: ${{ env.DIST_DIR }}/
          retention-days: 7
          if-no-files-found: warn

      # Pull requests from forks get a read-only token and cannot comment, so skip them.
      # The comment is informational: never let it fail the required check.
      - name: Post build summary to PR
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const distPath = process.env.DIST_DIR;

            let buildSize = 'N/A';
            let fileCount = 0;

            if (fs.existsSync(distPath)) {
              const getSize = (dir) => {
                let size = 0;
                for (const file of fs.readdirSync(dir)) {
                  const filePath = path.join(dir, file);
                  const stat = fs.statSync(filePath);
                  if (stat.isDirectory()) size += getSize(filePath);
                  else { size += stat.size; fileCount++; }
                }
                return size;
              };
              buildSize = (getSize(distPath) / 1024 / 1024).toFixed(2) + ' MB';
            }

            const identifier = 'Discord Guard Build Summary';
            const body = [
              `## ${identifier}`,
              '',
              `**Commit:** \`${context.sha.substring(0, 7)}\``,
              `**Workflow:** [View Run](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
              '',
              '### Build Stats',
              `- Build Size: ${buildSize}`,
              `- Files: ${fileCount}`,
              '',
              `<sub>Updated at ${new Date().toUTCString()}</sub>`
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(identifier));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Publishes the one verdict the ruleset requires. Port of reusable-ci-gate.yml
  # in TPN-Labs/GitHub-Actions (a public repository cannot call it). Approved as
  # a new job under Constitution §4.VII: it is the "one job collects individual
  # check outcomes and publishes a final verdict" form, and it has to run after
  # the other jobs (`needs:` + `if: always()`), so it can't be a step in one.
  gate:
    name: 'CI Gate / Result'
    if: always()
    needs: [quality, build-and-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check upstream job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        # The needs JSON is read from an env var, never interpolated into the
        # script, so job names or outputs can't inject code.
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('fs');

          const needs = JSON.parse(process.env.NEEDS_JSON || '{}');
          const jobs = Object.entries(needs);
          if (jobs.length === 0) {
            console.log("::error::No upstream jobs. The gate job must list them in 'needs:'.");
            process.exit(1);
          }

          const passing = new Set(['success', 'skipped']);
          const icon = { success: '✅', skipped: '⏭️', failure: '❌', cancelled: '🚫' };
          const failed = jobs.filter(([, job]) => !passing.has(job.result));

          const rows = jobs.map(([name, job]) => `| \`${name}\` | ${icon[job.result] || '❓'} ${job.result} |`);
          const summary = [
            `## ${failed.length ? '❌ CI Gate failed' : '✅ CI Gate passed'}`,
            '',
            '| Job | Result |',
            '|-----|--------|',
            ...rows,
            '',
          ].join('\n');
          if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);

          for (const [name, job] of jobs) console.log(`${name}: ${job.result}`);

          if (failed.length) {
            for (const [name, job] of failed) console.log(`::error::Upstream job '${name}' ended with '${job.result}'.`);
            process.exit(1);
          }
          console.log('All upstream jobs succeeded or were skipped.');
          JS
